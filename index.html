            }

            let last = pathPoints[pathPoints.length-1];

            }

            pathPoints.push(SCHOOL_COORDS);

        { name:"福田6", code:"RC319", up:["桃源村地铁站","侨城一号广场","华侨城医院","鸿新花园①","市眼科医院","竹子林地铁站①"], down:["竹子林地铁站①","市眼科医院","鸿新花园①","华侨城医院","侨城一号广场","桃源村地铁站"] },
        { name:"观澜", code:"RC320", up:["福安雅园","长湖地铁站","观澜地铁站①","松元厦地铁站①"], down:["松元厦地铁站①","观澜地铁站①","长湖地铁站","福安雅园"] },
        { name:"平湖", code:"RC321", up:["格兰云天酒店","中航格澜郡","观澜高新园","平湖智造园","东都雅苑","华南城地铁站"], down:["华南城地铁站","东都雅苑","平湖智造园","观澜高新园","中航格澜郡","格兰云天酒店"] },
        { name:"宝安1", code:"RC322", up:["宝安桃源居","宝田一路地铁站"], down:["宝田一路地铁站","宝安桃源居"] },
        { name:"宝安2", code:"RC323", up:["西乡大道西岗路口","大益广场","西乡盐田大门","坪洲新村","深业新岸线"], down:["深业新岸线","坪洲新村","西乡盐田大门","大益广场","西乡大道西岗路口"] },
        { name:"宝安3", code:"RC324", up:["固戍地铁站北","碧海湾地铁站","径贝居委会"], down:["径贝居委会","碧海湾地铁站","固戍地铁站北"] },
        { name:"宝安4", code:"RC325", up:["西乡立交①","宝安中心医院①","上川地铁站","宝民社区"], down:["上川地铁站","宝民社区","宝安中心医院①","西乡立交①"] },
        { name:"宝安5", code:"RC326", up:["翻身地铁站","宝安中心地铁站"], down:["宝安中心地铁站","翻身地铁站"] },
        { name:"宝安6", code:"RC327", up:["中粮创芯公园北","洪浪北地铁站","灵芝公园北"], down:["灵芝公园北","洪浪北地铁站","中粮创芯公园北"] },
        { name:"南山1", code:"RC328", up:["海月地铁站①","湾厦地铁站","蛇口广场"], down:["蛇口广场","湾厦地铁站","海月地铁站①"] },
        { name:"南山2", code:"RC329", up:["南山书城地铁站①","后海地铁站","科苑地铁站"], down:["科苑地铁站","后海地铁站","南山书城地铁站①"] },
        { name:"南山3", code:"RC330", up:["松坪山","沙河西铜鼓天桥","白石洲③","世界之窗①","华侨城地铁站","侨城东地铁站"], down:["侨城东地铁站","华侨城地铁站","世界之窗①","白石洲③","沙河西铜鼓天桥","松坪山"] },
        { name:"南山4", code:"RC331", up:["鼎太风华","南山村西","太子山庄②","南山花园","荔山工业园"], down:["荔山工业园","南山花园","太子山庄","南山村西","鼎太风华"] },
        { name:"南山5", code:"RC332", up:["桂庙新村","南油地铁站","蛇口沃尔玛"], down:["蛇口沃尔玛②","南油地铁站","桂庙新村"] },
        { name:"南山6", code:"RC333", up:["研祥科技大厦①","荔香公园","南头古城","星海名城","大新村"], down:["大新村","星海名城","南头古城地铁站①","荔香公园","研祥科技大厦①"] },
        { name:"龙华1", code:"RC334", up:["龙华地铁站","龙华壹方城西","深圳北站东广场"], down:["深圳北站东广场","龙华壹方城西","龙华地铁站"] },
        { name:"民治", code:"RC336", up:["上芬地铁站","世纪春城","民治地铁站"], down:["民治地铁站","世纪春城","上芬地铁站"] },
        { name:"福永", code:"RC337", up:["凤凰花苑","宝安区公共卫生福永分中心","福永会堂","万福广场","福永地铁站","桥头地铁站①"], down:["桥头地铁站①","福永地铁站","万福广场","福永会堂","宝安区公共卫福永分中心","凤凰花苑"] },
        { name:"新桥", code:"RC338", up:["新桥中心客运站","丽沙花都","新桥市民广场","西荟城广场"], down:["西荟城广场","新桥市民广场","丽沙花都","新桥中心客运站"] },
        { name:"南山3-2", code:"RC339", up:["西丽法庭③","西丽社区①"], down:["西丽社区①","西丽法庭③"] }
    ];
    
    // 构建站点到线路的映射
    let stationToRoutes = new Map();
    routesData.forEach(route => {
        const allStops = new Set([...route.up, ...route.down]);
        allStops.forEach(stop => {
            if (!stationToRoutes.has(stop)) stationToRoutes.set(stop, []);
            stationToRoutes.get(stop).push(route);
        });
    });
    
    // 初始化地图 (手机端默认视野稍微拉近)
    const map = L.map('map').setView(SCHOOL_COORDS, 10.8);
    // Stamen Toner 黑白地图 - 极简风格，国内稳定源
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB',
        subdomains: 'abcd',
        maxZoom: 18,
        minZoom: 9
    }).addTo(map);

    
    // 学校红色五角星
    const schoolIcon = L.divIcon({ html: '<div style="font-size:34px; color:#e34234; text-shadow:0 0 4px white; line-height:1;">★</div>', iconSize: [34,34], className: 'custom-school-divicon', popupAnchor: [0,-15] });
    L.marker(SCHOOL_COORDS, { icon: schoolIcon, zIndexOffset: 500 }).addTo(map).bindPopup(`<b>🏫 ${SCHOOL_NAME}</b><br>📍 光明区`).openPopup();

    // 添加新庄地铁站（在建中）标记
    const underConstructionIcon = L.divIcon({
        html: '<div style="font-size:12px; color:#ff9800; background:rgba(255,255,255,0.8); border-radius:12px; padding:2px 4px; white-space:nowrap;">🚧🚉 新庄站(在建)</div>',
        iconSize: [null, 20],
        className: 'metro-station-icon',
     popupAnchor: [0, -10]
    });
    L.marker([22.769291, 113.897882], { icon: underConstructionIcon, zIndexOffset: 400 })
        .addTo(map)
        .bindPopup(`
            <b>🚧 新庄站（在建中）</b><br>
            🚇 深圳地铁13号线<br>
            📅 预计2026年开通<br>
            📍 距离学校约1.3公里
            `);
    // 添加公明广场地铁站标记
    const metroIcon = L.divIcon({
        html: '<div style="font-size:14px; color:#0078d7; background:rgba(255,255,255,0.95); border-radius:14px; padding:2px 4px; white-space:nowrap;">🚉 公明广场</div>',
        iconSize: [null, 20],
        className: 'metro-station-icon',
        popupAnchor: [0, -10]
    });
    L.marker([22.780579, 113.887276], { icon: metroIcon, zIndexOffset: 400 })
        .addTo(map)
        .bindPopup('<b>🚉 公明广场站</b><br>深圳地铁6号线<br>距学校约2公里');
    let stationMarkers = new Map();
    let stationLabelMarkers = new Map();
    let currentLines = [];
    let currentHighlightedLines = [];
    
    let allStationsSet = new Set();
    routesData.forEach(r => { r.up.forEach(s=>allStationsSet.add(s)); r.down.forEach(s=>allStationsSet.add(s)); });
    
    allStationsSet.forEach(station => {
        const coord = getStationCoord(station);
        const marker = L.circleMarker(coord, {
            radius: 6,
            fillColor: "#2a81cb",
            color: "#ffffff",
            weight: 2,
            fillOpacity: 0.9,
            className: 'station-circle'
        }).addTo(map);
        
        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            const routes = stationToRoutes.get(station) || [];
            const routeNames = routes.map(r => `${r.name}线`).join('、');
            highlightRoutesByStation(station);
            const label = stationLabelMarkers.get(station);
            if (label) { label.setOpacity(1); setTimeout(() => { if (label) label.setOpacity(0); }, 4000); }
            marker.bindPopup(`<b>🚏 ${station}</b><br>🚌 途经 ${routes.length} 条线路<br>${routeNames}`).openPopup();
            marker.setStyle({ fillColor: "#e74c3c", radius: 8 });
            setTimeout(() => { marker.setStyle({ fillColor: "#2a81cb", radius: 6 }); }, 1000);
        });
        stationMarkers.set(station, marker);
        
        const labelDiv = L.divIcon({
            className: 'station-label',
            html: `<div style="background: rgba(255,255,240,0.92); border-radius: 14px; padding: 2px 7px; font-size: 10px; font-weight: 600; border-left: 2px solid #2a81cb;">${station}</div>`,
            iconSize: [null, 18],
            popupAnchor: [0, -8]
        });
        const labelMarker = L.marker(coord, { icon: labelDiv, interactive: false, zIndexOffset: 10 });
        labelMarker.addTo(map);
        labelMarker.setOpacity(0);
        stationLabelMarkers.set(station, labelMarker);
    });
    
    function highlightRoutesByStation(stationName) {
        clearHighlightedLines();
        const routes = stationToRoutes.get(stationName);
        if (!routes || routes.length === 0) return;
        clearNormalLines();
        routes.forEach(route => {
            const path = buildRoutePathByStationOrder(route);
            if (path.length >= 2) {
                const line = L.polyline(path, { color: "#e67e22", weight: 5, opacity: 0.95, smoothFactor: 1.0 }).addTo(map);
                currentHighlightedLines.push(line);
            }
        });
        const relatedStations = new Set();
        routes.forEach(route => { route.up.forEach(s=>relatedStations.add(s)); route.down.forEach(s=>relatedStations.add(s)); });
        relatedStations.forEach(s => { const l = stationLabelMarkers.get(s); if(l) l.setOpacity(1); });
        setTimeout(() => { relatedStations.forEach(s => { const l = stationLabelMarkers.get(s); if(l && l.getOpacity()===1) l.setOpacity(0); }); }, 5000);
        if (currentHighlightedLines.length > 0) { try { const group = L.featureGroup(currentHighlightedLines); map.fitBounds(group.getBounds().pad(0.2)); } catch(e) {} }
    }
    
    function clearHighlightedLines() { currentHighlightedLines.forEach(l => map.removeLayer(l)); currentHighlightedLines = []; }
    function clearNormalLines() { currentLines.forEach(l => map.removeLayer(l)); currentLines = []; }
    function hideAllStationLabels() { stationLabelMarkers.forEach(l => l.setOpacity(0)); }
    
    function drawSingleRoute(route) {
        clearHighlightedLines(); clearNormalLines(); hideAllStationLabels();
        const path = buildRoutePathByStationOrder(route);
        if (path.length >= 2) {
            const polyline = L.polyline(path, { color: "#f39c12", weight: 4.5, opacity: 0.95, smoothFactor: 1.0 }).addTo(map);
            currentLines.push(polyline);
            map.fitBounds(polyline.getBounds().pad(0.2));
        }
        const routeStations = new Set([...route.up, ...route.down]);
        routeStations.forEach(s => { const l = stationLabelMarkers.get(s); if(l) l.setOpacity(1); const m = stationMarkers.get(s); if(m) m.setStyle({ fillColor: "#e67e22", radius: 7 }); });
        setTimeout(() => { routeStations.forEach(s => { const m = stationMarkers.get(s); if(m) m.setStyle({ fillColor: "#2a81cb", radius: 6 }); }); }, 2000);
    }
    
    function displayAllRoutesOverview() {
        clearHighlightedLines(); clearNormalLines(); hideAllStationLabels();
        routesData.forEach(route => {
            const path = buildRoutePathByStationOrder(route);
            if (path.length >= 2) {
                const line = L.polyline(path, { color: "#7f8c8d", weight: 2.0, opacity: 0.5, smoothFactor: 1.0 }).addTo(map);
                currentLines.push(line);
            }
        });
        stationMarkers.forEach(m => m.setStyle({ fillColor: "#2a81cb", radius: 6 }));
    }
    
    const selectEl = document.getElementById('routeSelect');
    routesData.forEach(r => { let opt = document.createElement('option'); opt.value = r.code; opt.textContent = `${r.name}线`; selectEl.appendChild(opt); });
    selectEl.addEventListener('change', (e) => {
        if (e.target.value === 'all') displayAllRoutesOverview();
        else { const route = routesData.find(r => r.code === e.target.value); if(route) drawSingleRoute(route); }
    });
    
    displayAllRoutesOverview();
    L.control.scale({ metric: true, imperial: false, position: 'bottomright' }).addTo(map);
    map.on('click', function(e) { if (currentHighlightedLines.length > 0) { displayAllRoutesOverview(); selectEl.value = 'all'; } hideAllStationLabels(); });
    
    // 针对手机触屏优化：防止点击穿透
    document.querySelectorAll('.route-select').forEach(el => {
        el.addEventListener('touchstart', (e) => { e.stopPropagation(); });
    });
</script>
</body>
</html>
